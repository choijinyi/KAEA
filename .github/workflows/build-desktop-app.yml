name: Build Desktop App

on:
  push:
    tags: ['v*']
    branches: ['claude/cli-auto-installer-desktop-nevsj1']
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스 태그 (예: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli-auto-installer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # 코드 서명 인증서 없이 빌드 (서명은 추후 인증서 발급 시 추가)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-app-${{ matrix.os }}
          path: |
            cli-auto-installer/dist/*.exe
            cli-auto-installer/dist/*.dmg

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || 'v1.0.0' }}
          files: |
            cli-auto-installer/dist/*.exe
            cli-auto-installer/dist/*.dmg
